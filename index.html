<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mohamed Mounir | Contact</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --whatsapp: #25D366;
      --instapay: #8b5cf6;
      --location: #ef4444;
      --facebook: #1877f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated Background Particles/Blobs */
    .bg-shape {
      position: absolute;
      filter: blur(90px);
      z-index: -1;
      animation: float 12s infinite alternate ease-in-out;
      opacity: 0.6;
    }

    .shape1 {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.4), rgba(37, 99, 235, 0.1));
      top: -5%;
      left: -5%;
      border-radius: 50%;
    }

    .shape2 {
      width: 500px;
      height: 500px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.4), rgba(109, 40, 217, 0.1));
      bottom: -10%;
      right: -10%;
      border-radius: 50%;
      animation-delay: -6s;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }

      33% {
        transform: translate(30px, -50px) scale(1.1);
      }

      66% {
        transform: translate(-20px, 20px) scale(0.9);
      }

      100% {
        transform: translate(0, 50px) scale(1.05);
      }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 40px 30px;
      width: 90%;
      max-width: 420px;
      margin: 20px 0;
      text-align: center;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transform: translateY(30px) scale(0.95);
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      position: relative;
      overflow: hidden;
    }

    @keyframes slideUp {
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .profile-photo {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--accent), var(--instapay));
      padding: 5px;
      position: relative;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: transform 0.4s ease;
    }

    .profile-photo:hover {
      transform: scale(1.05) rotate(5deg);
    }

    .profile-photo img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #1e293b;
      border: 3px solid var(--bg-color);
    }

    .name {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 5px;
      letter-spacing: 0.5px;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 35px;
      font-weight: 300;
    }

    .phone-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 35px;
    }

    .phone-number {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      color: #fff;
      text-decoration: none;
    }

    .phone-number:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .phone-number:active {
      transform: translateY(1px);
    }

    .phone-number i {
      font-size: 18px;
      color: var(--text-muted);
      transition: color 0.3s ease;
    }

    .phone-number:hover i {
      color: #fff;
    }

    .whatsapp-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--whatsapp);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
      position: relative;
    }

    .whatsapp-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 50%;
      border: 2px solid white;
      opacity: 0;
      transform: scale(1);
      transition: all 0.3s ease;
    }

    .whatsapp-btn:hover {
      transform: scale(1.1) rotate(8deg);
      box-shadow: 0 12px 25px rgba(37, 211, 102, 0.5);
    }

    .whatsapp-btn:hover::after {
      opacity: 0.5;
      transform: scale(1.15);
    }

    .action-links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      border-radius: 20px;
      text-decoration: none;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .link-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-4px);
    }

    .link-btn.instapay:hover {
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 12px 24px rgba(139, 92, 246, 0.2);
    }

    .link-btn.location:hover {
      border-color: rgba(239, 68, 68, 0.5);
      box-shadow: 0 12px 24px rgba(239, 68, 68, 0.2);
    }

    .link-btn.facebook:hover {
      border-color: rgba(24, 119, 242, 0.5);
      box-shadow: 0 12px 24px rgba(24, 119, 242, 0.2);
    }

    .link-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      margin-right: 18px;
      background: rgba(255, 255, 255, 0.05);
      transition: all 0.4s ease;
    }

    .link-btn.instapay .link-icon {
      color: #a78bfa;
    }

    .link-btn.location .link-icon {
      color: #f87171;
    }

    .link-btn.facebook .link-icon {
      color: #60a5fa;
    }

    .link-btn:hover .link-icon {
      transform: scale(1.1) rotate(-5deg);
    }

    .link-btn.instapay:hover .link-icon {
      background: var(--instapay);
      color: white;
    }

    .link-btn.location:hover .link-icon {
      background: var(--location);
      color: white;
    }

    .link-btn.facebook:hover .link-icon {
      background: var(--facebook);
      color: white;
    }

    .link-text {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .link-arrow {
      margin-left: auto;
      font-size: 14px;
      color: var(--text-muted);
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateX(-10px);
    }

    .link-btn:hover .link-arrow {
      opacity: 1;
      transform: translateX(0);
      color: #fff;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast i {
      color: #10b981;
      font-size: 18px;
    }

    /* Staggered animation for list items */
    .action-links .link-btn {
      opacity: 0;
      transform: translateY(20px);
    }

    .action-links .link-btn:nth-child(1) {
      animation: slideUp 0.6s 0.3s forwards;
    }

    .action-links .link-btn:nth-child(2) {
      animation: slideUp 0.6s 0.4s forwards;
    }

    .action-links .link-btn:nth-child(3) {
      animation: slideUp 0.6s 0.5s forwards;
    }

    /* Ripple Effect for interactive elements */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0);
      animation: rippleEffect 0.6s linear;
      pointer-events: none;
    }

    @keyframes rippleEffect {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <!-- Background Shapes -->
  <div class="bg-shape shape1"></div>
  <div class="bg-shape shape2"></div>

  <!-- Main Card -->
  <div class="card">
    <div class="profile-photo">
      <!-- Using UI Avatars for a sleek placeholder with initial 'M' -->
      <img src="./img.jpeg" alt="Mohamed Mounir">
    </div>

    <h1 class="name">Mohamed Mounir</h1>
    <p class="title">Architecture Engineer & Designer</p>

    <!-- Phone & WhatsApp -->
    <div class="phone-row">
      <a href="tel:01281112120" class="phone-number" title="Click to call">
        <i class="fas fa-phone"></i>
        <span>01281112120</span>
      </a>
      <a href="https://wa.me/201281112120" target="_blank" class="whatsapp-btn" aria-label="WhatsApp">
        <i class="fab fa-whatsapp"></i>
      </a>
    </div>

    <!-- Action Links -->
    <div class="action-links">
      <a href="https://ipn.eg/S/mohamedmounir1738/instapay/1c3qMM" target="_blank" class="link-btn instapay">
        <div class="link-icon">
          <i class="fas fa-wallet"></i>
        </div>
        <span class="link-text">InstaPay Account</span>
        <i class="fas fa-chevron-right link-arrow"></i>
      </a>

      <a href="https://www.google.com/maps/place/30°09'22.6%22N+31°36'33.6%22E/@30.156271,31.609336,17z/data=!3m1!4b1!4m4!3m3!8m2!3d30.156271!4d31.609336!18m1!1e1?entry=ttu&g_ep=EgoyMDI2MDMyMy4xIKXMDSoASAFQAw%3D%3D"
        target="_blank" class="link-btn location">
        <div class="link-icon">
          <i class="fas fa-map-marker-alt"></i>
        </div>
        <span class="link-text">Location</span>
        <i class="fas fa-chevron-right link-arrow"></i>
      </a>

      <a href="https://www.facebook.com/point.plot?rdid=tn0OHhpHjNRwr1Fd&share_url=https%3A%2F%2Fwww.facebook.com%2Fshare%2F1DeaTAd77e%2F%3Fref%3D1"
        target="_blank" class="link-btn facebook">
        <div class="link-icon">
          <i class="fab fa-facebook-f"></i>
        </div>
        <span class="link-text">Facebook</span>
        <i class="fas fa-chevron-right link-arrow"></i>
      </a>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <i class="fas fa-check-circle"></i> <span>Phone number copied!</span>
  </div>

  <script>
    // Create ripple effect on click
    function createRipple(event, element) {
      const circle = document.createElement("span");
      const diameter = Math.max(element.clientWidth, element.clientHeight);
      const radius = diameter / 2;

      const rect = element.getBoundingClientRect();

      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${event.clientX - rect.left - radius}px`;
      circle.style.top = `${event.clientY - rect.top - radius}px`;
      circle.classList.add("ripple");

      const ripple = element.querySelector(".ripple");
      if (ripple) {
        ripple.remove();
      }

      element.appendChild(circle);
    }

    // Copy phone number function
    function copyNumber(event) {
      createRipple(event, event.currentTarget);

      const number = document.getElementById('phoneNumber').innerText;

      // Attempt modern Clipboard API first
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(number).then(() => {
          showToast();
        }).catch(err => {
          fallbackCopyTextToClipboard(number);
        });
      } else {
        fallbackCopyTextToClipboard(number);
      }
    }

    // Fallback copy mechanism for older browsers / non-HTTPS
    function fallbackCopyTextToClipboard(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;

      // Avoid scrolling to bottom
      textArea.style.top = "0";
      textArea.style.left = "0";
      textArea.style.position = "fixed";

      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      try {
        const successful = document.execCommand('copy');
        if (successful) showToast();
      } catch (err) {
        console.error('Fallback: Oops, unable to copy', err);
      }

      document.body.removeChild(textArea);
    }

    let toastTimeout;
    // Show toast notification
    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
  </script>
</body>

</html>
